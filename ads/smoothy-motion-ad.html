<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Smoothy — Motion Ad (1080x1080)</title>
<style>
  :root{
    --bg1:#0a1f1a; --bg2:#0f3d30; --accent:#39e0a6; --accent2:#7af0c8;
    --ink:#eafff6; --muted:#9fd9c5;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#05100d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}

  /* 1080x1080 square ad. Scale down to fit screen for preview. */
  .ad{
    position:relative;width:1080px;height:1080px;overflow:hidden;
    background:radial-gradient(120% 120% at 50% 0%,var(--bg2),var(--bg1) 60%,#05100d);
    color:var(--ink);transform:scale(.62);transform-origin:center;
    border-radius:28px;
  }

  .brand{position:absolute;top:54px;left:60px;display:flex;align-items:center;gap:14px;font-weight:800;font-size:34px;letter-spacing:.3px}
  .brand .dot{width:34px;height:34px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 30px rgba(57,224,166,.55)}

  .stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}

  .headline{position:absolute;top:150px;width:100%;text-align:center;padding:0 70px}
  .headline h1{font-size:74px;line-height:1.04;font-weight:800;opacity:0;animation:rise .8s ease forwards .2s}
  .headline h1 span{color:var(--accent)}

  /* Paycheck that drops in */
  .paycheck{
    position:absolute;top:300px;left:50%;transform:translate(-50%,-260px);
    width:520px;padding:30px 38px;border-radius:22px;
    background:linear-gradient(135deg,#123c30,#0c2a22);
    border:1px solid rgba(122,240,200,.25);
    box-shadow:0 30px 80px rgba(0,0,0,.45);
    opacity:0;animation:drop 1s cubic-bezier(.2,.9,.2,1) forwards 1.1s;
  }
  .paycheck .row{display:flex;justify-content:space-between;align-items:center}
  .paycheck .lbl{font-size:26px;color:var(--muted);font-weight:600}
  .paycheck .amt{font-size:58px;font-weight:800;color:var(--ink)}
  .paycheck .sub{margin-top:6px;font-size:22px;color:var(--accent)}

  /* Buckets the money routes into */
  .buckets{position:absolute;bottom:210px;width:100%;display:flex;gap:26px;justify-content:center}
  .bucket{
    width:280px;padding:26px 24px;border-radius:20px;text-align:left;
    background:rgba(255,255,255,.04);border:1px solid rgba(122,240,200,.18);
    opacity:0;transform:translateY(24px);
  }
  .bucket.b1{animation:pop .5s ease forwards 2.5s}
  .bucket.b2{animation:pop .5s ease forwards 2.7s}
  .bucket.b3{animation:pop .5s ease forwards 2.9s}
  .bucket .icon{font-size:34px}
  .bucket .name{margin-top:10px;font-size:26px;font-weight:700}
  .bucket .val{margin-top:6px;font-size:40px;font-weight:800;color:var(--accent)}

  /* Coins flying from paycheck to buckets */
  .coin{position:absolute;top:340px;left:50%;width:26px;height:26px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,var(--accent2),var(--accent));
    box-shadow:0 0 18px rgba(57,224,166,.8);opacity:0}
  .coin.c1{animation:fly1 1s ease forwards 2.35s}
  .coin.c2{animation:fly2 1s ease forwards 2.5s}
  .coin.c3{animation:fly3 1s ease forwards 2.65s}

  .cta{position:absolute;bottom:80px;width:100%;text-align:center;opacity:0;animation:rise .7s ease forwards 3.2s}
  .cta .btn{display:inline-block;padding:24px 56px;border-radius:999px;font-size:34px;font-weight:800;color:#05221a;
    background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 16px 50px rgba(57,224,166,.45)}
  .cta .fine{margin-top:18px;font-size:24px;color:var(--muted)}

  @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
  @keyframes drop{from{opacity:0;transform:translate(-50%,-260px)}to{opacity:1;transform:translate(-50%,0)}}
  @keyframes pop{to{opacity:1;transform:translateY(0)}}
  @keyframes fly1{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(-300px,520px)}}
  @keyframes fly2{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(0,520px)}}
  @keyframes fly3{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(300px,520px)}}

  /* loop the whole thing every 6s */
  .ad{animation:loop 6s infinite}
  @keyframes loop{0%,92%{opacity:1}97%{opacity:0}100%{opacity:1}}
</style>
</head>
<body>
  <div class="ad">
    <div class="brand"><span class="dot"></span> Smoothy</div>

    <div class="headline"><h1>Get paid. <span>Save automatically.</span></h1></div>

    <div class="paycheck">
      <div class="row">
        <div class="lbl">Paycheck deposited</div>
        <div class="amt">$2,400</div>
      </div>
      <div class="sub">Smoothy caught it the second it landed →</div>
    </div>

    <div class="coin c1"></div>
    <div class="coin c2"></div>
    <div class="coin c3"></div>

    <div class="buckets">
      <div class="bucket b1"><div class="icon">🏦</div><div class="name">Savings</div><div class="val">+$480</div></div>
      <div class="bucket b2"><div class="icon">📈</div><div class="name">Investing</div><div class="val">+$240</div></div>
      <div class="bucket b3"><div class="icon">🎯</div><div class="name">Goals</div><div class="val">+$180</div></div>
    </div>

    <div class="cta">
      <span class="btn">Start free →</span>
      <div class="fine">First 1,000 users · 3 months Pro · No credit card</div>
    </div>
  </div>
</body>
</html>
