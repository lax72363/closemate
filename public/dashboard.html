<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CloseMate — Leads Dashboard</title>
<style>
  *{margin:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
  body{background:#f2f4f6;color:#1d2b33;padding:30px 4vw}
  h1{font-size:22px;margin-bottom:4px}
  .sub{color:#68767e;font-size:13px;margin-bottom:24px}
  .login{max-width:380px;background:#fff;padding:26px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  input{width:100%;padding:11px;border:1px solid #cfd6da;border-radius:8px;font-size:14px;margin:10px 0}
  button{background:#0f6f5c;color:#fff;border:none;border-radius:8px;padding:11px 22px;font-size:14px;cursor:pointer}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  th,td{padding:12px 14px;text-align:left;font-size:13px;border-bottom:1px solid #eef1f3;vertical-align:top}
  th{background:#14313f;color:#fff;font-weight:600;white-space:nowrap}
  tr:hover td{background:#f8fafb}
  .pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase}
  .hot{background:#ffe1dc;color:#c22c15}.warm{background:#fff2d6;color:#9a6b00}.cold{background:#e2ecf2;color:#3d6478}
  .empty{padding:40px;text-align:center;color:#68767e;background:#fff;border-radius:12px}
  .stats{display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap}
  .stat{background:#fff;border-radius:12px;padding:16px 22px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  .stat b{display:block;font-size:24px}
  .stat span{font-size:12px;color:#68767e}
  #err{color:#c22c15;font-size:13px;margin-top:8px}
</style>
</head>
<body>
<h1>CloseMate — Lead Dashboard</h1>
<div class="sub">Every conversation your website assistant turns into a lead lands here (newest first).</div>

<div id="login" class="login">
  <label for="tok"><b>Dashboard token</b></label>
  <input id="tok" type="password" placeholder="Enter your dashboard token"/>
  <button onclick="load()">View leads</button>
  <div id="err"></div>
</div>

<div id="app" style="display:none">
  <div class="stats">
    <div class="stat"><b id="s-total">0</b><span>Total leads</span></div>
    <div class="stat"><b id="s-hot">0</b><span>Hot</span></div>
    <div class="stat"><b id="s-week">0</b><span>Last 7 days</span></div>
  </div>
  <div id="tablewrap"></div>
</div>

<script>
const params = new URLSearchParams(location.search);
if (params.get("token")) { document.getElementById("tok").value = params.get("token"); load(); }

async function load() {
  const token = document.getElementById("tok").value.trim();
  const err = document.getElementById("err");
  err.textContent = "";
  try {
    const r = await fetch("/api/leads", { headers: { "x-dashboard-token": token } });
    if (r.status === 401) { err.textContent = "Wrong token."; return; }
    const { leads } = await r.json();
    render(leads);
    sessionStorage.setItem("cm_dash_token", token);
    document.getElementById("login").style.display = "none";
    document.getElementById("app").style.display = "block";
  } catch (e) { err.textContent = "Could not reach the server."; }
}

function esc(s){const d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML;}

function render(leads) {
  document.getElementById("s-total").textContent = leads.length;
  document.getElementById("s-hot").textContent = leads.filter(l=>l.temperature==="hot").length;
  const week = Date.now() - 7*864e5;
  document.getElementById("s-week").textContent = leads.filter(l=>new Date(l.capturedAt).getTime()>week).length;

  if (!leads.length) {
    document.getElementById("tablewrap").innerHTML = '<div class="empty">No leads yet — try the <a href="/demo.html">demo site</a> and introduce yourself to the assistant.</div>';
    return;
  }
  const rows = leads.map(l => `<tr>
    <td>${esc(new Date(l.capturedAt).toLocaleString())}</td>
    <td><b>${esc(l.name||"—")}</b></td>
    <td>${esc(l.phone||"")}${l.phone&&l.email?"<br>":""}${esc(l.email||"")}</td>
    <td>${esc(l.intent||"—")}</td>
    <td>${esc(l.area||"—")}</td>
    <td>${esc(l.budget||"—")}</td>
    <td>${esc(l.timeline||"—")}</td>
    <td><span class="pill ${esc(l.temperature||"cold")}">${esc(l.temperature||"?")}</span></td>
    <td>${esc(l.notes||"")}</td>
  </tr>`).join("");
  document.getElementById("tablewrap").innerHTML =
    `<table><thead><tr><th>Captured</th><th>Name</th><th>Contact</th><th>Intent</th><th>Area</th><th>Budget</th><th>Timeline</th><th>Temp</th><th>Notes</th></tr></thead><tbody>${rows}</tbody></table>`;
}
</script>
</body>
</html>
